version: '3.8'

services:
  ai-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-ecommerce-app
    ports:
      - "5000:5000"
    environment:
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - FLASK_ENV=production
    env_file:
      - .env
    volumes:
      # Mount model files (read-only for security)
      - ./ecommerce_cnn_model.h5:/app/ecommerce_cnn_model.h5:ro
      - ./class_names.pkl:/app/class_names.pkl:ro
      - ./datasets:/app/datasets:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ai-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

networks:
  ai-network:
    driver: bridge
